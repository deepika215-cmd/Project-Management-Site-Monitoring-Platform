<div class="user-management">
  <div class="page-header">
    <div>
      <h1>User Management</h1>
      <p>Manage BuildTrack user accounts and access.</p>
    </div>

    <button type="button" class="add-user-btn" (click)="openForm()">
      + Add User
    </button>
  </div>

  @if (showForm) {
    <div class="form-card">
      <h2>Add New User</h2>

      <form (ngSubmit)="addUser()">
        <div class="form-grid">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" [(ngModel)]="newUser.name" name="name" required>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" [(ngModel)]="newUser.email" name="email" required>
          </div>

          <div class="form-group">
            <label>Role</label>
            <select [(ngModel)]="newUser.role" name="role" required>
              <option value="">Select a role</option>
              <option>Administrator</option>
              <option>Project Manager</option>
              <option>Site Engineer</option>
              <option>Contractor</option>
              <option>Worker</option>
              <option>Client</option>
            </select>
          </div>

          <div class="form-group">
            <label>Status</label>
            <select [(ngModel)]="newUser.status" name="status">
              <option>Active</option>
              <option>Inactive</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="cancel-btn" (click)="cancel()">
            Cancel
          </button>

          <button type="submit" class="save-btn">
            Save User
          </button>
        </div>
      </form>
    </div>
  }

  <div class="users-card">
    <h2>All Users</h2>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email Address</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          @for (user of users; track user.email) {
            <tr>
              <td>{{ user.name }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.role }}</td>
              <td>
                <span
                  class="status"
                  [class.active]="user.status === 'Active'"
                  [class.inactive]="user.status === 'Inactive'">
                  {{ user.status }}
                </span>
              </td>
              <td>
                <button
                  type="button"
                  class="remove-btn"
                  (click)="removeUser(user.email)">
                  Remove
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
