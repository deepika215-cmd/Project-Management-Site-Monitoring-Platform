<section class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Sign in to continue managing your projects</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <small class="error" *ngIf="submitted && f['email'].errors?.['required']">Email is required.</small>
        <small class="error" *ngIf="submitted && f['email'].errors?.['email']">Please enter a valid email address.</small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter your password" />
        <small class="error" *ngIf="submitted && f['password'].errors?.['required']">Password is required.</small>
        <small class="error" *ngIf="submitted && f['password'].errors?.['minlength']">Password must be at least 8 characters.</small>
        <small class="error" *ngIf="submitted && f['password'].errors?.['pattern']">Password must include at least one uppercase letter and one number.</small>
      </div>

      <div class="form-options">
        <label class="checkbox">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Remember Me</span>
        </label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-button">Login</button>
    </form>

    <p class="register-link">
      Don’t have an account?
      <a routerLink="/register">Create one here</a>
    </p>
  </div>
</section>
