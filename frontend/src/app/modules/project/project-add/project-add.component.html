<form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="project-add-form">
  <h2>Add New Project</h2>

  <div class="form-field">
    <label for="name">Project name</label>
    <input id="name" type="text" formControlName="name" placeholder="Enter project name" />
    <div class="error" *ngIf="name?.invalid && (name?.dirty || name?.touched)">
      <span *ngIf="name?.errors?.['required']">Project name is required.</span>
    </div>
  </div>

  <div class="form-field">
    <label for="description">Description</label>
    <textarea id="description" formControlName="description" rows="4" placeholder="Project description"></textarea>
  </div>

  <div class="form-row">
    <div class="form-field">
      <label for="startDate">Start date</label>
      <input id="startDate" type="date" formControlName="startDate" />
      <div class="error" *ngIf="startDate?.invalid && (startDate?.dirty || startDate?.touched)">
        <span *ngIf="startDate?.errors?.['required']">Start date is required.</span>
      </div>
    </div>

    <div class="form-field">
      <label for="endDate">End date</label>
      <input id="endDate" type="date" formControlName="endDate" />
    </div>
  </div>

  <div class="form-row">
    <div class="form-field">
      <label for="budget">Budget</label>
      <input id="budget" type="number" formControlName="budget" min="0" placeholder="0" />
      <div class="error" *ngIf="budget?.invalid && (budget?.dirty || budget?.touched)">
        <span *ngIf="budget?.errors?.['required']">Budget is required.</span>
        <span *ngIf="budget?.errors?.['min']">Budget cannot be negative.</span>
      </div>
    </div>

    <div class="form-field">
      <label for="status">Status</label>
      <select id="status" formControlName="status">
        <option value="planning">Planning</option>
        <option value="in-progress">In progress</option>
        <option value="completed">Completed</option>
        <option value="on-hold">On hold</option>
      </select>
    </div>
  </div>

  <button type="submit" [disabled]="projectForm.invalid">Create Project</button>
</form>
