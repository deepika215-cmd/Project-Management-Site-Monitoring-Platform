<div class="page-container"><aside class="sidebar"><div class="logo"><h2>BuildTrack</h2><span>Construction Management</span></div><nav><a routerLink="/workforce">Workforce</a><a routerLink="/attendance" class="active">Attendance</a></nav></aside><main class="main-content"><header class="page-header"><div><h1>Attendance</h1><p>Record attendance using the existing FastAPI attendance API.</p></div></header><p *ngIf="error" class="error">{{error}}</p><section class="card"><form (ngSubmit)="save()"><select name="worker" [(ngModel)]="form.worker_id" required><option [ngValue]="0">Select worker</option><option *ngFor="let w of workers" [ngValue]="w.id">{{w.name}}</option></select><input type="date" name="date" [(ngModel)]="form.date" required><select name="status" [(ngModel)]="form.status"><option>Present</option><option>Absent</option><option>Leave</option></select><button type="submit">Record Attendance</button></form></section><section class="card"><table><thead><tr><th>Worker ID</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody><tr *ngFor="let r of records"><td>{{r.worker_id}}</td><td>{{r.date}}</td><td>{{r.status}}</td><td><button (click)="remove(r.id)">Delete</button></td></tr><tr *ngIf="!records.length"><td colspan="4">No attendance records.</td></tr></tbody></table></section></main></div>
