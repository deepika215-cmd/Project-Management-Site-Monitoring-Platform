<div class="auth-container">

  <div class="reset-card">

    <h1>BuildTrack</h1>
    <h2>Reset Password</h2>

    @if (!tokenPresent) {
      <p>This reset link is missing or invalid.</p>
      <p class="back-link"><a routerLink="/forgot-password">Request a new reset link</a></p>
    } @else {
      <p>Enter a new password for your account.</p>

      <form (ngSubmit)="submit()">
        <div class="form-group">
          <label>New Password</label>
          <div class="password-field">
            <input [type]="showNewPassword ? 'text' : 'password'" [(ngModel)]="newPassword" name="newPassword" placeholder="Enter new password" required>
            <button type="button" class="toggle-password" (click)="toggleNewPassword()">{{ showNewPassword ? 'Hide' : 'Show' }}</button>
          </div>
          <small>Use 8+ characters with uppercase, lowercase, number and special character.</small>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="password-field">
            <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
            <button type="button" class="toggle-password" (click)="toggleConfirmPassword()">{{ showConfirmPassword ? 'Hide' : 'Show' }}</button>
          </div>
        </div>

        <button type="submit" class="reset-btn" [disabled]="submitting">
          {{ submitting ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>

      <p class="back-link"><a routerLink="/login">← Back to Login</a></p>
    }

  </div>

</div>
