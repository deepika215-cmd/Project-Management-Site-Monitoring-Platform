<div class="auth-container">

  <div class="forgot-card">

    <h1>BuildTrack</h1>
    <h2>Forgot Password?</h2>
    <p>Enter your email address to generate a password reset link.</p>

    <form (ngSubmit)="resetPassword()">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required>
      </div>

      <button type="submit" class="reset-btn" [disabled]="submitting">
        {{ submitting ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <div *ngIf="devResetLink" class="dev-reset-box">
      <p><strong>Local development reset link</strong></p>
      <input [value]="devResetLink" readonly>
      <button type="button" (click)="copyResetLink()">Copy Link</button>
      <small>This appears only because email SMTP is not configured for the local project.</small>
    </div>

    <p class="back-link">
      <a routerLink="/login">← Back to Login</a>
    </p>

  </div>

</div>
