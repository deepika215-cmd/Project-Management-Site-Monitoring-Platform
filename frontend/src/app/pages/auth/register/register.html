<div class="auth-container">

  <div class="register-card">

    <h1>BuildTrack</h1>
    <h2>Create Account</h2>
    <p>Register a new user account. Admin accounts are created only from the seeded backend account.</p>

    <form (ngSubmit)="register()">

      <div class="form-row">
        <div class="form-group">
          <label>Full Name <span>*</span></label>
          <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
          <label>Email Address <span>*</span></label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Mobile Number <span>*</span></label>
          <input type="tel" [(ngModel)]="mobile" name="mobile" placeholder="Enter mobile number" required>
        </div>

        <div class="form-group">
          <label>Employee ID <span>*</span></label>
          <input type="text" [(ngModel)]="employeeId" name="employeeId" placeholder="Example: EMP001" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Role <span>*</span></label>
          <select [(ngModel)]="role" name="role" required>
            <option value="">Select Role</option>
            <option value="PROJECT_MANAGER">Project Manager</option>
            <option value="SITE_ENGINEER">Site Engineer</option>
            <option value="CONTRACTOR">Contractor</option>
            <option value="WORKER">Worker</option>
            <option value="CLIENT">Client</option>
          </select>
        </div>

        <div class="form-group">
          <label>Department / Designation</label>
          <input type="text" [(ngModel)]="department" name="department" placeholder="Optional">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Password <span>*</span></label>
          <div class="password-field">
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="Enter password" required>
            <button type="button" class="toggle-password" (click)="togglePassword()">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
          <small>Use 8+ characters with uppercase, lowercase, number and special character.</small>
        </div>

        <div class="form-group">
          <label>Confirm Password <span>*</span></label>
          <div class="password-field">
            <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
            <button type="button" class="toggle-password" (click)="toggleConfirmPassword()">
              {{ showConfirmPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea [(ngModel)]="address" name="address" rows="3" placeholder="Optional address"></textarea>
      </div>

      <button type="submit" class="register-btn" [disabled]="submitting">
        {{ submitting ? 'Creating Account...' : 'Create Account' }}
      </button>

    </form>

    <p class="login-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>

</div>
