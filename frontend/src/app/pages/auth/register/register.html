<div class="auth-container">

  <div class="register-card">

    <h1>BuildTrack</h1>

    <h2>Create Account</h2>

    <p>
      Register a new user account
    </p>

    <form
      (ngSubmit)="register()">

      <div class="form-group">

        <label>Full Name</label>

        <input
          type="text"
          [(ngModel)]="fullName"
          name="fullName"
          required
        >

      </div>


      <div class="form-group">

        <label>Email Address</label>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
        >

      </div>


      <div class="form-group">

        <label>Mobile Number</label>

        <input
          type="tel"
          [(ngModel)]="mobile"
          name="mobile"
          required
        >

      </div>


      <div class="form-group">

        <label>Employee ID</label>

        <input
          type="text"
          [(ngModel)]="employeeId"
          name="employeeId"
          required
        >

      </div>


      <div class="form-group">

        <label>Role</label>

        <select
          [(ngModel)]="role"
          name="role"
          required>

          <option value="">
            Select Role
          </option>

          <option value="ADMIN">
            Administrator
          </option>

          <option value="PROJECT_MANAGER">
            Project Manager
          </option>

          <option value="SITE_ENGINEER">
            Site Engineer
          </option>

          <option value="CONTRACTOR">
            Contractor
          </option>

          <option value="WORKER">
            Worker
          </option>

          <option value="CLIENT">
            Client
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          Department / Designation
        </label>

        <input
          type="text"
          [(ngModel)]="department"
          name="department"
        >

      </div>


      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
        >

      </div>


      <div class="form-group">

        <label>
          Confirm Password
        </label>

        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
        >

      </div>


      <div class="form-group">

        <label>Address</label>

        <textarea
          [(ngModel)]="address"
          name="address"
          rows="3">
        </textarea>

      </div>


      <button
        type="submit"
        class="register-btn">

        Create Account

      </button>


    </form>


    <p class="login-link">

      Already have an account?

      <a routerLink="/login">
        Login
      </a>

    </p>

  </div>

</div>
