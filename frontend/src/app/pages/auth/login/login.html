<div class="auth-container">

  <div class="auth-card">

    <div class="logo-section">
      <h1>BuildTrack</h1>
      <p>Construction Project Management Platform</p>
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Login to access your account</p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label>Email Address</label>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required
        >

      </div>

      <div class="login-options">

        <label class="remember">

          <input
            type="checkbox"
            [(ngModel)]="rememberMe"
            name="rememberMe"
          >

          Remember Me

        </label>

        <a routerLink="/forgot-password">
          Forgot Password?
        </a>

      </div>

      <button
        type="submit"
        class="login-btn">

        Login

      </button>

    </form>

    <p class="register-text">

      Don't have an account?

      <a routerLink="/register">
        Create an account
      </a>

    </p>

  </div>

</div>
