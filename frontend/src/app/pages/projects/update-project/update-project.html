<div class="page-container">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="logo">
      <h2>BuildTrack</h2>
      <span>Construction Management</span>
    </div>

    <nav>

      <a routerLink="/dashboard">
        Dashboard
      </a>

      <a routerLink="/projects" class="active">
        My Projects
      </a>

      <a routerLink="/projects/create">
        Create Project
      </a>

      <a routerLink="/projects/milestones">
        Milestones
      </a>

      <a routerLink="/projects/schedule">
        Schedule
      </a>

    </nav>

    <div class="sidebar-bottom">

      <a>Notifications</a>

      <a>Profile</a>

      <a routerLink="/dashboard">
        Logout
      </a>

    </div>

  </aside>


  <!-- Main Content -->
  <main class="main-content">

    <!-- Header -->
    <div class="page-header">

      <div>

        <h1>Update Project</h1>

        <p>
          Update project information and settings
        </p>

      </div>

      <button
        class="back-btn"
        routerLink="/projects">

        ← Back to Projects

      </button>

    </div>


    <!-- Update Form -->
    <form
      class="project-form"
      (ngSubmit)="updateProject()">


      <!-- Project Information -->
      <section class="form-section">

        <h2>Project Information</h2>

        <div class="form-grid">


          <!-- Project Name -->
          <div class="form-group">

            <label>
              Project Name *
            </label>

            <input
              type="text"
              [(ngModel)]="project.name"
              name="projectName"
              required>

          </div>


          <!-- Project Code -->
          <div class="form-group">

            <label>
              Project Code *
            </label>

            <input
              type="text"
              [(ngModel)]="project.code"
              name="projectCode"
              required>

          </div>


          <!-- Category -->
          <div class="form-group">

            <label>
              Project Category *
            </label>

            <select
              [(ngModel)]="project.category"
              name="category"
              required>

              <option value="Residential">
                Residential
              </option>

              <option value="Commercial">
                Commercial
              </option>

              <option value="Industrial">
                Industrial
              </option>

              <option value="Infrastructure">
                Infrastructure
              </option>

              <option value="Government">
                Government
              </option>

            </select>

          </div>


          <!-- Priority -->
          <div class="form-group">

            <label>
              Priority *
            </label>

            <select
              [(ngModel)]="project.priority"
              name="priority"
              required>

              <option value="Low">
                Low
              </option>

              <option value="Medium">
                Medium
              </option>

              <option value="High">
                High
              </option>

              <option value="Critical">
                Critical
              </option>

            </select>

          </div>


          <!-- Description -->
          <div class="form-group full-width">

            <label>
              Project Description
            </label>

            <textarea
              [(ngModel)]="project.description"
              name="description"
              rows="4">
            </textarea>

          </div>

        </div>

      </section>


      <!-- Client Information -->
      <section class="form-section">

        <h2>Client Information</h2>

        <div class="form-grid">


          <div class="form-group">

            <label>
              Client Name *
            </label>

            <input
              type="text"
              [(ngModel)]="project.clientName"
              name="clientName"
              required>

          </div>


          <div class="form-group">

            <label>
              Client Email *
            </label>

            <input
              type="email"
              [(ngModel)]="project.clientEmail"
              name="clientEmail"
              required>

          </div>


          <div class="form-group">

            <label>
              Client Phone
            </label>

            <input
              type="tel"
              [(ngModel)]="project.clientPhone"
              name="clientPhone">

          </div>

        </div>

      </section>


      <!-- Location -->
      <section class="form-section">

        <h2>Project Location</h2>

        <div class="form-grid">

          <div class="form-group full-width">

            <label>
              Project Address *
            </label>

            <textarea
              [(ngModel)]="project.location"
              name="location"
              rows="3"
              required>
            </textarea>

          </div>

        </div>

      </section>


      <!-- Budget & Schedule -->
      <section class="form-section">

        <h2>Budget & Schedule</h2>

        <div class="form-grid">


          <div class="form-group">

            <label>
              Estimated Budget *
            </label>

            <input
              type="number"
              [(ngModel)]="project.budget"
              name="budget"
              min="0"
              required>

          </div>


          <div class="form-group">

            <label>
              Start Date *
            </label>

            <input
              type="date"
              [(ngModel)]="project.startDate"
              name="startDate"
              required>

          </div>


          <div class="form-group">

            <label>
              Expected Completion Date *
            </label>

            <input
              type="date"
              [(ngModel)]="project.completionDate"
              name="completionDate"
              required>

          </div>

        </div>

      </section>


      <!-- Project Assignment -->
      <section class="form-section">

        <h2>Project Assignment</h2>

        <div class="form-grid">


          <!-- Project Manager -->
          <div class="form-group">

            <label>
              Project Manager
            </label>

            <select
              [(ngModel)]="project.manager"
              name="manager">

              <option value="Raj Kumar">
                Raj Kumar
              </option>

              <option value="Arun Kumar">
                Arun Kumar
              </option>

              <option value="Vijay Kumar">
                Vijay Kumar
              </option>

              <option value="Suresh Kumar">
                Suresh Kumar
              </option>

            </select>

          </div>


          <!-- Status -->
          <div class="form-group">

            <label>
              Project Status
            </label>

            <select
              [(ngModel)]="project.status"
              name="status">

              <option value="Planning">
                Planning
              </option>

              <option value="In Progress">
                In Progress
              </option>

              <option value="On Hold">
                On Hold
              </option>

              <option value="Completed">
                Completed
              </option>

              <option value="Closed">
                Closed
              </option>

            </select>

          </div>


          <!-- Progress -->
          <div class="form-group">

            <label>
              Project Completion (%)
            </label>

            <input
              type="number"
              [(ngModel)]="project.progress"
              name="progress"
              min="0"
              max="100">

          </div>

        </div>

      </section>


      <!-- Update History -->
      <section class="form-section">

        <h2>Update Reason</h2>

        <div class="form-group full-width">

          <label>
            Reason for Update
          </label>

          <textarea
            [(ngModel)]="updateReason"
            name="updateReason"
            rows="4"
            placeholder="Explain why this project information is being updated...">
          </textarea>

        </div>

      </section>


      <!-- Buttons -->
      <div class="form-actions">

        <button
          type="button"
          class="cancel-btn"
          routerLink="/projects">

          Cancel

        </button>


        <button
          type="submit"
          class="submit-btn">

          Save Changes

        </button>

      </div>

    </form>

  </main>

</div>
