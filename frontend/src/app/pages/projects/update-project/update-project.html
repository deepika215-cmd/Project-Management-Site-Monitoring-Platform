<div class="page-container">
  <app-sidebar active="projects"></app-sidebar>
  <main class="main-content">
    <header class="page-header"><div><span class="eyebrow">PROJECT MANAGEMENT</span><h1>Edit Project</h1><p>Update the persisted project record through FastAPI.</p></div><a class="back-btn" [routerLink]="['/projects/project-details',projectId]">← Back</a></header>
    <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="loading-card" *ngIf="loading && !project.id"><div class="spinner"></div><p>Loading project...</p></div>
    <form class="project-form" *ngIf="project.id" (ngSubmit)="updateProject()" #form="ngForm">
      <section class="form-card"><div class="card-heading"><div><h2>Project Information</h2><p>Changes are saved to the backend database.</p></div></div><div class="form-grid">
        <div class="form-group"><label>Project Name <span>*</span></label><input name="name" [(ngModel)]="project.name" required></div>
        <div class="form-group"><label>Location <span>*</span></label><input name="location" [(ngModel)]="project.location" required></div>
        <div class="form-group"><label>Start Date <span>*</span></label><input type="date" name="start" [(ngModel)]="project.startDate" required></div>
        <div class="form-group"><label>End Date <span>*</span></label><input type="date" name="end" [(ngModel)]="project.completionDate" required></div>
        <div class="form-group"><label>Budget (₹) <span>*</span></label><input type="number" name="budget" [(ngModel)]="project.budget" min="0" required></div>
        <div class="form-group"><label>Manager ID <span>*</span></label><input type="number" name="managerId" [(ngModel)]="project.managerId" min="1" required></div>
        <div class="form-group"><label>Status</label><select name="status" [(ngModel)]="project.status"><option>Planning</option><option>In Progress</option><option>Completed</option><option>Closed</option></select></div>
        <div class="form-group full-width"><label>Description</label><textarea name="description" [(ngModel)]="project.description" rows="6"></textarea></div>
      </div></section>
      <div class="form-actions"><a class="secondary-btn" [routerLink]="['/projects/project-details',projectId]">Cancel</a><button class="primary-btn" type="submit" [disabled]="loading || form.invalid">{{ loading ? 'Saving...' : 'Save Changes' }}</button></div>
    </form>
  </main>
</div>
