<div class="notifications-page"><app-sidebar active="notifications"></app-sidebar><main class="main-content"><header class="notifications-header"><div><p class="breadcrumb">Dashboard / Notifications</p><h1>Project Notifications</h1><p class="subtitle">Live notifications from the BuildTrack notification API.</p></div></header><div class="error" *ngIf="error">{{error}}</div><div class="loading" *ngIf="loading">Loading notifications...</div><section class="notifications-grid" *ngIf="!loading"><article class="notification-card" *ngFor="let n of notifications"><div class="card-icon">🔔</div><div><h3>{{n.title || n.message || "Notification"}}</h3><p>{{n.message || n.description || "No message"}}</p><small>{{n.created_at || n.time || ""}}</small></div></article><p *ngIf="!notifications.length">No notifications found.</p></section></main></div>
