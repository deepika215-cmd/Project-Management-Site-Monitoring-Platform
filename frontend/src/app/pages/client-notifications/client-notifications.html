<div class="page-container"><app-sidebar active="notifications"></app-sidebar><main class="main-content"><header class="page-header"><h1>Client Notifications</h1><p>Live notifications from BuildTrack.</p></header><div class="error" *ngIf="error">{{error}}</div><div class="loading" *ngIf="loading">Loading notifications...</div><section class="notification-list" *ngIf="!loading"><article class="notification-card" *ngFor="let n of notifications"><strong>{{n.title || n.message || "Notification"}}</strong><p>{{n.message || n.description || "No message"}}</p><small>{{n.created_at || n.time || ""}}</small></article><p *ngIf="!notifications.length">No notifications found.</p></section></main></div>
